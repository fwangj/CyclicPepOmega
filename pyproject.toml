[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclicpepomega"
version = "0.1.0"
description = "Connectivity-first identification of cyclic peptides in PDB structures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CyclicPepOmega contributors"}]
dependencies = []

[project.optional-dependencies]
gemmi = ["gemmi>=0.7"]
test = ["pytest>=8"]

[project.scripts]
cyclicpepomega = "cyclicpepomega.cli:main"
cpo = "cyclicpepomega.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
